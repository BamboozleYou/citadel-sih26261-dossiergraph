# APH 2024-27 Annexure-14 state-wise competent authorities for land, building,
# occupancy and fire safety certificates.
default:
  land_deed: ["Sub-Registrar", "Registrar", "Revenue Department", "Tehsildar"]
  land_use_certificate: ["Town and Country Planning", "Town Planning", "Development Authority", "District Collector", "Revenue"]
  building_plan: ["Municipal Corporation", "Development Authority", "Municipality", "Town and Country Planning", "Panchayat"]
  occupancy_certificate: ["Municipal Corporation", "Development Authority", "Municipality", "Panchayat"]
  fire_safety_certificate: ["Fire and Emergency Services", "Fire Services", "Fire and Rescue Services", "Chief Fire Officer"]

